
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TE LO HAGO | Profesionales cerca de ti</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --azul: #1769bd;
  --oscuro: #183451;
  --fondo: #f1f5fb;
  --blanco: #ffffff;
  --gris: #718096;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--fondo);
  color: var(--oscuro);
}
header {
  background: linear-gradient(135deg,#173c66,#1976c9);
  color: white;
  padding: 35px 20px 40px;
  border-radius: 0 0 28px 28px;
}
.logo {
  text-align: center;
  font-size: 32px;
  font-weight: 900;
  margin: 12px 0 22px;
}
.logo span { color: #42c5ee; }
header p {
  text-align: center;
  font-size: 17px;
  line-height: 1.5;
}
.container {
  max-width: 850px;
  margin: auto;
  padding: 20px 16px 100px;
}
.account {
  background: white;
  border-radius: 18px;
  padding: 16px;
  margin-top: -12px;
  box-shadow: 0 4px 18px #173c6612;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.account small { color: var(--gris); }
button {
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  background: var(--azul);
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button.secondary {
  background: #eaf1fa;
  color: var(--oscuro);
}
h2 { font-size: 22px; margin: 28px 0 15px; }
.search {
  display: flex;
  gap: 8px;
}
.search input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border: 1px solid #d8e0eb;
  border-radius: 12px;
  font-size: 16px;
  background: white;
}
.categories {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
}
.category {
  background: white;
  color: var(--oscuro);
  border: 1px solid #e1e8f1;
  padding: 18px 10px;
  border-radius: 15px;
  text-align: left;
  font-size: 15px;
}
.category.active {
  background: #e5f1ff;
  border: 2px solid var(--azul);
}
.category span {
  display: block;
  font-size: 25px;
  margin-bottom: 8px;
}
.professional {
  background: white;
  padding: 17px;
  border-radius: 17px;
  margin-bottom: 13px;
  box-shadow: 0 3px 12px #1834510b;
}
.professional img {
  width: 72px;
  height: 72px;
  border-radius: 14px;
  object-fit: cover;
  float: right;
}
.professional h3 { margin: 0 0 8px; }
.professional p {
  color: var(--gris);
  line-height: 1.5;
  margin: 7px 0;
}
.tag {
  display: inline-block;
  color: #1769bd;
  background: #eaf3ff;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: bold;
  margin-top: 5px;
}
.empty {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  color: var(--gris);
  line-height: 1.6;
}
.hidden { display: none !important; }
footer {
  text-align: center;
  padding: 25px 10px;
  color: #8999ad;
  font-size: 13px;
}
@media(min-width:600px) {
  .categories { grid-template-columns: repeat(4,1fr); }
}
</style>
</head>

<body>

<header>
  <div class="logo">🔧 TE LO <span>HAGO</span></div>
  <p>Encuentra profesionales de confianza cerca de ti.</p>
</header>

<main class="container">

  <section class="account">
    <div>
      <strong>👤 Mi cuenta</strong><br>
      <small id="userEmail">Comprobando sesión...</small>
    </div>
    <button class="secondary" id="logoutBtn">Salir</button>
  </section>

  <section>
    <h2>¿Qué necesitas?</h2>
    <div class="search">
      <input id="searchInput" type="search"
        placeholder="Ej. fontanero, electricista...">
      <button id="searchBtn">Buscar</button>
    </div>
  </section>

  <section>
    <h2>Servicios</h2>
    <div class="categories" id="categories">
      <button class="category" data-category="Fontanería">
        <span>🚿</span>Fontanería
      </button>
      <button class="category" data-category="Electricidad">
        <span>💡</span>Electricidad
      </button>
      <button class="category" data-category="Albañilería">
        <span>🧱</span>Albañilería
      </button>
      <button class="category" data-category="Jardinería">
        <span>🌿</span>Jardinería
      </button>
      <button class="category" data-category="Pintura">
        <span>🎨</span>Pintura
      </button>
      <button class="category" data-category="Limpieza">
        <span>🧹</span>Limpieza
      </button>
      <button class="category" data-category="Mudanzas">
        <span>📦</span>Mudanzas
      </button>
      <button class="category" data-category="Reformas">
        <span>🏠</span>Reformas
      </button>
    </div>
  </section>

  <section>
    <h2 id="resultsTitle">Profesionales disponibles</h2>
    <div id="professionalList">
      <div class="empty">Cargando profesionales...</div>
    </div>
  </section>

  <footer>
    TE LO HAGO · Servicios profesionales cerca de ti
  </footer>
</main>

<script>
const SUPABASE_URL = "https://nqekyrivripxgvibfqkf.supabase.co";
const SUPABASE_KEY = "sb_publishable_gosLaK8usvl1hUsKmOgQiw_1Z2VeDpu";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let selectedCategory = "";

const list = document.getElementById("professionalList");
const searchInput = document.getElementById("searchInput");

async function startApp() {
  const { data, error } = await db.auth.getSession();

  if (error || !data.session) {
    window.location.href = window.location.pathname;
    return;
  }

  currentUser = data.session.user;
  document.getElementById("userEmail").textContent =
    currentUser.email || "Cuenta iniciada";

  await loadProfessionals();
}

async function loadProfessionals() {
  list.innerHTML = '<div class="empty">Buscando profesionales...</div>';

  let query = db
    .from("professional_profiles")
    .select("id, profession, description, service_area, profile_photo, experience_years, hourly_rate")
    .eq("status", "approved");

  if (selectedCategory) {
    query = query.ilike("profession", `%${selectedCategory}%`);
  }

  const search = searchInput.value.trim();

  if (search) {
    query = query.or(
      `profession.ilike.%${search}%,service_area.ilike.%${search}%,description.ilike.%${search}%`
    );
  }

  const { data, error } = await query.limit(30);

  if (error) {
    list.innerHTML =
      '<div class="empty">No se han podido cargar los profesionales. Inténtalo de nuevo más tarde.</div>';
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML =
      '<div class="empty">Todavía no hay profesionales aprobados en esta categoría. ¡Pronto habrá novedades!</div>';
    return;
  }

  list.innerHTML = "";

  data.forEach(pro => {
    const card = document.createElement("article");
    card.className = "professional";

    const title = document.createElement("h3");
    title.textContent = pro.profession || "Profesional";

    const description = document.createElement("p");
    description.textContent =
      pro.description || "Profesional disponible para solicitudes de presupuesto.";

    const area = document.createElement("p");
    area.textContent = "📍 " + (pro.service_area || "Zona por confirmar");

    const experience = document.createElement("p");
    experience.textContent =
      "Experiencia: " +
      (pro.experience_years ?? "No indicada") +
      (pro.experience_years === null ? "" : " años");

    const price = document.createElement("p");
    price.textContent = pro.hourly_rate
      ? "Precio orientativo: " + pro.hourly_rate + " €/hora"
      : "Precio: consultar";

    card.append(title, description, area, experience, price);

    if (pro.profile_photo) {
      const img = document.createElement("img");
      img.src = pro.profile_photo;
      img.alt = "Foto del profesional";
      card.prepend(img);
    }

    const approved = document.createElement("span");
    approved.className = "tag";
    approved.textContent = "Perfil aprobado";
    card.append(approved);

    list.append(card);
  });
}

document.getElementById("searchBtn").addEventListener("click", () => {
  loadProfessionals();
});

searchInput.addEventListener("keydown", event => {
  if (event.key === "Enter") loadProfessionals();
});

document.querySelectorAll(".category").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".category").forEach(b =>
      b.classList.remove("active")
    );

    if (selectedCategory === button.dataset.category) {
      selectedCategory = "";
    } else {
      selectedCategory = button.dataset.category;
      button.classList.add("active");
    }

    loadProfessionals();
  });
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();

  if (error) {
    alert("No se ha podido cerrar la sesión.");
    return;
  }

  window.location.reload();
});

startApp();
</script>
</body>
</html>
