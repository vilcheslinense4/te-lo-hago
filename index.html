
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102d50">
<title>TE LO HAGO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f6fb;color:#172b46}
header{background:linear-gradient(135deg,#102d50,#1764b5);color:white;padding:30px 20px;border-radius:0 0 25px 25px}
.logo{font-size:30px;font-weight:900}
.logo span{color:#43c6f5}
header p{margin-top:10px}
main{max-width:480px;margin:25px auto;padding:0 17px}
.card,.account{background:white;padding:23px;border-radius:18px;box-shadow:0 3px 15px #0000000c}
h2{margin-bottom:20px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
button{border:0;border-radius:10px;padding:14px;background:#176bc0;color:white;font-size:15px;font-weight:bold;cursor:pointer}
.tabs button{flex:1;background:#eaf0f8;color:#173b63}
.tabs button.active{background:#176bc0;color:white}
input,select{width:100%;padding:14px;margin:8px 0 17px;border:1px solid #d7dfeb;border-radius:10px;font-size:16px;background:white}
label{font-size:14px;font-weight:bold}
.primary{width:100%;margin-top:8px}
.secondary{background:#eaf0f8;color:#176bc0}
.hidden{display:none!important}
.message{padding:13px;border-radius:9px;margin:12px 0;font-size:14px;line-height:1.5;display:none}
.error{background:#ffeded;color:#a22}
.success{background:#e8f7ee;color:#176b3b}
.note{font-size:12px;color:#718096;line-height:1.5;margin-top:15px}
.account p{margin:12px 0}
footer{text-align:center;color:#8290a2;font-size:12px;padding:25px}
</style>
</head>

<body>
<header>
<div class="logo">🔧 TE LO <span>HAGO</span></div>
<p>Encuentra profesionales de confianza cerca de ti.</p>
</header>

<main>
<div class="card" id="authCard">
<h2>Bienvenido a TE LO HAGO</h2>

<div class="tabs">
<button id="loginTab" class="active" type="button">Entrar</button>
<button id="registerTab" type="button">Registrarme</button>
</div>

<div id="message" class="message"></div>

<form id="registerForm" class="hidden">
<label>Nombre y apellidos</label>
<input id="fullName" required maxlength="100" placeholder="Tu nombre completo">

<label>Correo electrónico</label>
<input id="registerEmail" type="email" required placeholder="Tu correo">

<label>Teléfono</label>
<input id="phone" type="tel" required placeholder="Tu teléfono">

<label>Localidad</label>
<input id="city" required maxlength="100" placeholder="Ej. La Línea de la Concepción">

<label>Tipo de cuenta</label>
<select id="role">
<option value="client">Cliente</option>
<option value="professional">Profesional</option>
</select>

<label>Contraseña</label>
<input id="registerPassword" type="password" minlength="8" required placeholder="Mínimo 8 caracteres">

<button class="primary" type="submit">Crear mi cuenta gratis</button>

<p class="note">El registro es gratuito. Antes de abrir el servicio al público incorporaremos las condiciones de uso y la política de privacidad.</p>
</form>

<form id="loginForm">
<label>Correo electrónico</label>
<input id="loginEmail" type="email" required placeholder="Tu correo">

<label>Contraseña</label>
<input id="loginPassword" type="password" required placeholder="Tu contraseña">

<button class="primary" type="submit">Iniciar sesión</button>
<button class="secondary primary" id="forgotPassword" type="button">He olvidado mi contraseña</button>
</form>
</div>

<div class="account hidden" id="accountCard">
<h2>¡Bienvenido!</h2>
<p id="accountName"></p>
<p id="accountRole"></p>
<p id="accountEmail"></p>
<div id="accountMessage" class="message"></div>
<button class="primary" id="logoutButton">Cerrar sesión</button>
</div>
</main>

<footer>TE LO HAGO · Servicios profesionales cerca de ti</footer>

<script>
const SUPABASE_URL = "https://nqekyrivripxgvibfqkf.supabase.co";
const SUPABASE_KEY = "sb_publishable_gosLaK8usvl1hUsKmOgQiw_1Z2VeDpu";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

function notify(text,type="success"){
  $("message").textContent=text;
  $("message").className="message "+type;
  $("message").style.display="block";
}

function showLogin(){
  $("loginForm").classList.remove("hidden");
  $("registerForm").classList.add("hidden");
  $("loginTab").classList.add("active");
  $("registerTab").classList.remove("active");
  $("message").style.display="none";
}

function showRegister(){
  $("registerForm").classList.remove("hidden");
  $("loginForm").classList.add("hidden");
  $("registerTab").classList.add("active");
  $("loginTab").classList.remove("active");
  $("message").style.display="none";
}

$("loginTab").onclick=showLogin;
$("registerTab").onclick=showRegister;

// REGISTRO
$("registerForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const button=e.submitter;
  button.disabled=true;

  try{
    const {data,error}=await db.auth.signUp({
      email:$("registerEmail").value.trim(),
      password:$("registerPassword").value,
      options:{
        data:{
          full_name:$("fullName").value.trim(),
          phone:$("phone").value.trim(),
          city:$("city").value.trim(),
          role:$("role").value
        }
      }
    });

    if(error)throw error;

    if(data.session){
      $("registerForm").reset();
      await loadAccount(data.session.user);
    }else{
      notify("Registro recibido. Revisa tu correo para confirmar tu cuenta.");
      $("registerForm").reset();
    }

  }catch(error){
    notify(error.message,"error");
  }finally{
    button.disabled=false;
  }
});

// INICIO DE SESIÓN
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const button=e.submitter;
  button.disabled=true;

  try{
    const {data,error}=await db.auth.signInWithPassword({
      email:$("loginEmail").value.trim(),
      password:$("loginPassword").value
    });

    if(error)throw error;
    await loadAccount(data.user);

  }catch(error){
    notify(error.message,"error");
  }finally{
    button.disabled=false;
  }
});

// RECUPERAR CONTRASEÑA
$("forgotPassword").onclick=async()=>{
  const email=$("loginEmail").value.trim();

  if(!email){
    notify("Escribe tu correo electrónico primero.","error");
    return;
  }

  try{
    const {error}=await db.auth.resetPasswordForEmail(email,{
      redirectTo:location.origin+location.pathname
    });

    if(error)throw error;
    notify("Si el correo está registrado, recibirás instrucciones para recuperar tu contraseña.");

  }catch(error){
    notify(error.message,"error");
  }
};

// PERFIL
async function loadAccount(user){
  const {data,error}=await db.from("profiles")
    .select("full_name,role")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    $("accountMessage").textContent="Error consultando perfil: "+error.message;
    $("accountMessage").style.display="block";
    return;
  }

  $("authCard").classList.add("hidden");
  $("accountCard").classList.remove("hidden");

  $("accountName").textContent="Nombre: "+(data?.full_name||user.user_metadata?.full_name||"Usuario");
  $("accountRole").textContent=
    "Cuenta: "+(data?.role==="professional"?"Profesional":"Cliente");
  $("accountEmail").textContent="Correo: "+user.email;
}

// CERRAR SESIÓN
$("logoutButton").onclick=async()=>{
  const {error}=await db.auth.signOut();

  if(error){
    $("accountMessage").textContent=error.message;
    $("accountMessage").style.display="block";
    return;
  }

  $("accountCard").classList.add("hidden");
  $("authCard").classList.remove("hidden");
  showLogin();
};

// COMPROBAR SESIÓN
async function initialize(){
  const {data,error}=await db.auth.getSession();

  if(error){
    notify(error.message,"error");
    return;
  }

  if(data.session){
    await loadAccount(data.session.user);
  }
}

initialize();

db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"){
    $("accountCard").classList.add("hidden");
    $("authCard").classList.remove("hidden");
    showLogin();
  }
});
</script>
</body>
</html>
